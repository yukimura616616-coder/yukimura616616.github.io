FG<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学 院試 英単語アプリ</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --gray-text: #64748b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .category-badge {
            font-size: 0.8rem;
            background: #e0e7ff;
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .english-word {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .answer-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            width: 100%;
            display: none;
            text-align: left;
        }
        .answer-area.show {
            display: block;
        }
        .japanese {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .related {
            font-size: 0.95rem;
            color: var(--gray-text);
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: #e2e8f0; color: #334155; }
        .btn-secondary:hover { background-color: #cbd5e1; }
        
        .menu-box, .add-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }
        .menu-box select, .add-box input, .add-box select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .add-box label {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--gray-text);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧠 心理学 院試英単語アプリ</h1>

    <!-- モード選択・分野選択 -->
    <div class="menu-box">
    <label>🔎 単語検索</label>
    <input
        type="text"
        id="searchWord"
        placeholder="例: attachment">
    <button
        class="btn-primary"
        onclick="searchWord()">
        検索
    </button>
</div>
<div class="menu-box">
    <label>出題モード・分野</label>
    <select id="modeSelect" onchange="changeMode()">
        <option value="random">🔀 すべてからランダム</option>
    </select>
</div>
    <!-- 単語カード -->
    <div class="card" id="cardContainer">
        <div class="category-badge" id="cardCategory">分野</div>
        <div class="english-word" id="cardEnglish">読み込み中...</div>
        <div class="answer-area" id="answerArea">
            <div class="japanese" id="cardJapanese">日本語訳</div>
            <div class="related" id="cardRelated">関連用語・補足説明</div>
        </div>
    </div>
    <!-- アクションボタン -->
<div class="controls">
   <button class="btn-secondary" onclick="toggleMode()">
        英⇔日 切替
    </button>
    <button class="btn-secondary"
            id="revealBtn"
            onclick="revealAnswer()">
        答えを見る
    </button>
    <button class="btn-primary"
            id="nextBtn"
            onclick="nextCard()"
            style="display:none;">
        次の単語 ➔
    </button>
</div>
    <!-- 新規単語追加フォーム -->
    <div class="add-box">
        <label>➕ 新しい単語を追加</label>
        <input type="text" id="newEnglish" placeholder="英単語 (例: perception)">
        <input type="text" id="newJapanese" placeholder="日本語訳 (例: 知覚)">
        <label>分野</label>
        <select id="newCategory">
            <!-- JavaScriptで自動生成されます -->
        </select>
        <input type="text" id="newRelated" placeholder="関連用語・解説">
        <button class="btn-primary" onclick="addNewWord()">単語を追加する</button>
    </div>
</div>

        currentPool =
            words

        .style.display = 'block';
    document.getElementById('nextBtn')
        .style.display = 'none';
    if (currentPool.length === 0) {
        document.getElementById('cardCategory').innerText =
            "お知らせ";
        document.getElementById('cardEnglish').innerText =
            "該当する単語がありません";
        document.getElementById('cardJapanese').innerText =
            "";
        document.getElementById('cardRelated').innerText =
            "";
        return;
    }
    if (currentIndex >= currentPool.length) {
        currentPool.sort(
            () => Math.random() - 0.5
        );
        currentIndex = 0;
    }
    const currentWord =
        currentPool[currentIndex];
    document.getElementById('cardCategory').innerText =
        currentWord.category;
    if (quizMode === "en-jp") {
        document.getElementById('cardEnglish').innerText =
            currentWord.english;
        document.getElementById('cardJapanese').innerText =
            currentWord.japanese;
    } else {
        document.getElementById('cardEnglish').innerText =
            currentWord.japanese;
        document.getElementById('cardJapanese').innerText =
            currentWord.english;
    }
    document.getElementById('cardRelated').innerText =
        currentWord.related;
}
            function revealAnswer() {
        document.getElementById('answerArea')
        .classList.add('show');
    document.getElementById('revealBtn')
        .style.display = 'none';
    document.getElementById('nextBtn')
        .style.display = 'block';
    isAnswerShown = true;
}
function toggleMode() {
    if (quizMode === "en-jp") {
        quizMode = "jp-en";
    } else {
        quizMode = "en-jp";
    }
    showCard();
    }
function nextCard() {
    currentIndex++;
    showCard();
}
    function addNewWord() {
        const eng = document.getElementById('newEnglish').value.trim();
        const jpn = document.getElementById('newJapanese').value.trim();
        const cat = document.getElementById('newCategory').value;
        const rel = document.getElementById('newRelated').value.trim();
        if (!eng || !jpn) {
            alert('英単語と日本語訳は必ず入力してください。');
            return;
        }
        const newEntry = {
            english: eng,
            japanese: jpn,
            category: cat,
            related: rel ? `関連: ${rel}` : "関連用語なし"
        };
        words.push(newEntry);
        localStorage.setItem('psych_words', JSON.stringify(words));
        document.getElementById('newEnglish').value = '';
        document.getElementById('newJapanese').value = '';
        document.getElementById('newRelated').value = '';
        alert('新しい単語を追加しました！');
        updateCategorySelect();
        changeMode();
    }
function searchWord() {
    const keyword =
        document.getElementById("searchWord")
        .value
        .toLowerCase()
        .trim();
    const result =
        words.find(word =>
            word.english.toLowerCase().includes(keyword)
            ||
            word.japanese.includes(keyword)
        );
    if (!result) {
        alert("見つかりません");
        return;
    }
    document.getElementById("cardCategory").innerText =
        result.category;
    document.getElementById("cardEnglish").innerText =
        result.english;
    document.getElementById("cardJapanese").innerText =
        result.japanese;
    document.getElementById("cardRelated").innerText =
        result.related;
    document.getElementById("answerArea")
        .classList.add("show");
}
    initApp();
</script>
</body>
</html>
